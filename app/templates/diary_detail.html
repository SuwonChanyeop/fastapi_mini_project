{% extends "layout.html" %}
{% block content %}

<div class="container" style="max-width: 700px; margin: 0 auto; padding: 20px;">

    <h2 style="margin-bottom: 10px;">{{ diary.title }}</h2>

    <p style="color: #777; margin-bottom: 20px;">
        작성일:
        {{ diary.created_at | to_kst | datetime_format("%Y-%m-%d %H:%M") }}
    </p>

    {% if diary.image_path %}
        <div style="margin-bottom: 20px;">
            <img src="{{ diary.image_path }}" alt="Diary Image"
                 style="max-width:100%; border-radius:8px;">
        </div>
    {% endif %}

    <div style="white-space: pre-wrap; font-size:16px; margin-bottom:30px;">
        {{ diary.content }}
    </div>

    {% if user and diary and user.id == diary.user_id %}
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-bottom:20px;">

            <form action="/diary/{{ diary.id }}/edit" method="get">
                <button type="submit" class="btn-primary"
                    style="padding:8px 16px; font-size:14px;">수정</button>
            </form>

            <form action="/diary/{{ diary.id }}/delete" method="post"
                onsubmit="return confirm('정말 이 일기를 삭제하시겠습니까?');">
                <button type="submit" class="btn-primary"
                    style="padding:8px 16px; font-size:14px;
                           background-color:#ff4d4f; border-color:#ff4d4f;">삭제</button>
            </form>

        </div>
    {% endif %}

</div>

{% endblock %}
