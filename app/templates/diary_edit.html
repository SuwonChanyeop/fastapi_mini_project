{% extends "layout.html" %}
{% block content %}

<h1 style="font-size:28px; margin-bottom:20px;">일기 수정</h1>

<form action="/diary/{{ diary.id }}/edit" method="post" enctype="multipart/form-data">
    <div class="card show" style="padding: 20px; margin-bottom: 30px;">

        <div style="margin-bottom:16px;">
            <input
                type="text"
                name="title"
                placeholder="제목을 입력하세요"
                value="{{ diary.title }}"
                style="width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ddd;"
                required
            />
        </div>

        <div style="margin-bottom:16px;">
            <textarea
                name="content"
                placeholder="내용을 입력하세요"
                rows="8"
                style="width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ddd; resize:vertical;"
                required
            >{{ diary.content }}</textarea>
        </div>

        {% if diary.image_path %}
        <div style="margin-bottom:16px;">
            <p style="font-size:14px; margin-bottom:8px;">현재 이미지</p>
            <img src="{{ diary.image_path }}" alt="현재 이미지" style="max-width:100%; border-radius:8px;">
        </div>
        {% endif %}

        <div style="margin-bottom:16px;">
            <input
                type="file"
                name="image"
                accept="image/*"
                style="font-size:14px;"
            />
            <p style="font-size:12px; color:#777; margin-top:4px;">
                * 이미지를 새로 선택하면 기존 이미지를 교체합니다.
            </p>
        </div>

        <button
            type="submit"
            class="btn-primary"
            style="width:100%; margin-top:8px;"
        >
            수정 완료
        </button>
    </div>
</form>

{% endblock %}
