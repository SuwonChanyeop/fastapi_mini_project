{% extends "layout.html" %}
{% block content %}

<h1 style="font-size:28px; margin-bottom:20px;">일기 작성</h1>

<form action="/diary/create" method="post" enctype="multipart/form-data">
    <div class="card show" style="padding: 20px; margin-bottom: 30px;">

        
        <div style="margin-bottom:16px;">
            <input
                type="text"
                name="title"
                placeholder="제목을 입력하세요"
                style="width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ddd;"
                required
            />
        </div>

        
        <div style="margin-bottom:16px;">
            <textarea
                name="content"
                placeholder="내용을 입력하세요"
                rows="8"
                style="width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ddd; resize:vertical;"
                required
            ></textarea>
        </div>

        <!-- 이미지 첨부 (선택) -->
        <div style="margin-bottom:16px;">
            <input
                type="file"
                name="image"
                accept="image/*"
                style="font-size:14px;"
            />
        </div>

        <!-- 저장 버튼 -->
        <button
            type="submit"
            class="btn-primary"
            style="width:100%; margin-top:8px;"
        >
            저장하기
        </button>
    </div>
</form>

{% endblock %}
