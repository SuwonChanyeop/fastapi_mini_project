[project]
name = "fastapi_mini_project"
version = "0.1.0"
description = "FastAPI Mini Project"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "passlib[bcrypt]",
    "python-jose[cryptography]",
    "requests",
    "beautifulsoup4",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["app"]
